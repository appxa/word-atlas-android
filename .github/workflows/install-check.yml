name: Verify published APK installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download released APKs
        run: |
          curl -fL --retry 3 -o /tmp/old.apk https://github.com/appxa/word-atlas-android/releases/download/v1.0.10/WordAtlas-Android.apk
          curl -fL --retry 3 -o /tmp/new.apk https://github.com/appxa/word-atlas-android/releases/download/v1.0.13/WordAtlas-Android.apk
          sha256sum /tmp/old.apk /tmp/new.apk
          for apk in /tmp/old.apk /tmp/new.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk" | tail -1
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -5
          done
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install /tmp/old.apk
            adb shell am start -W -n com.appxa.wordatlas/.MainActivity
            adb install -r /tmp/new.apk
            adb shell dumpsys package com.appxa.wordatlas | grep -E 'versionCode=|versionName='
            adb shell am start -W -n com.appxa.wordatlas/.MainActivity
            adb uninstall com.appxa.wordatlas
            adb install /tmp/new.apk
            adb shell am start -W -n com.appxa.wordatlas/.MainActivity
