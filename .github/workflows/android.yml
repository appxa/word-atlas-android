name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ATLAS_BASE: ./
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wordatlas.jks"
      - name: Build signed release APK
        run: gradle :app:assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wordatlas.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: cf57f7bcb61b5e97bea3985b2441bd504403aacc6af7fecd169e4a27490f79b0
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/certs.txt"
          tr 'A-F' 'a-f' < "$RUNNER_TEMP/certs.txt" > "$RUNNER_TEMP/certs-lower.txt"
          grep -q "certificate sha-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs-lower.txt"
          echo "signing certificate matches the expected release key"
      - uses: actions/upload-artifact@v4
        with:
          name: word-atlas-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
